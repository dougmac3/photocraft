# craft-ui from storytold/craft-libs at 5c874d51eeb3de70e735c8ce87a59a7dedd47675, vendored to build
# against egui 0.37 (the rev the workspace names is on egui 0.36). Patched in by the root Cargo.toml.
[package]
name = "craft-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-libs"
description = "Reusable egui controls and icon catalogs for Craft frontends"

[dependencies]
egui = { version = "0.37.0", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
